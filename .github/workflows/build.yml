name: Build Plugin

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Clone LeviLamina SDK (with submodules)
        shell: pwsh
        run: |
          git clone --recursive https://github.com/LiteLDev/LeviLamina.git SDK
          Write-Host "SDK cloned successfully"

      - name: Configure CMake
        run: |
          cmake -B build -A x64

      - name: Build Plugin
        run: |
          cmake --build build --config Release

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: DisablePrivateChat
          path: build/Release/DisablePrivateChat.dll
