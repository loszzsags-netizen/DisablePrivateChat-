name: Build DisablePrivateChat DLL

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Clone LiteLoader SDK
        shell: pwsh
        run: |
          git clone --branch v2/main --depth 1 --recursive https://github.com/LiteLDev/LiteLoaderBDS.git SDK
          Write-Host "SDK 克隆完成"
          Get-ChildItem SDK/LiteLoader/lib -ErrorAction SilentlyContinue

      
      - name: Build Plugin
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          cmake -B build -S . -G "Visual Studio 17 2022" -A x64
          cmake --build build --config Release
      
      - name: Check output
        shell: pwsh
        run: Get-ChildItem build/Release -Recurse -Filter "*.dll"
      
      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: DisablePrivateChat
          path: build/Release/*.dll
          if-no-files-found: error
