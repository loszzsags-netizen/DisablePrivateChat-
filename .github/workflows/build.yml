name: Build Plugin

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Clone LiteLoader SDK (with submodules)
        shell: pwsh
        run: |
          git clone --recursive https://github.com/LiteLDev/LiteLoaderSDK.git SDK
          Write-Host "SDK cloned successfully"
          if (Test-Path SDK/LiteLoader/include/entt) {
            Write-Host "entt found in SDK"
            Get-ChildItem SDK/LiteLoader/include/entt
          } else {
            Write-Host "entt not found!" -ForegroundColor Red
          }

      - name: Configure CMake
        run: |
          cmake -B build -A x64

      - name: Build Plugin
        run: |
          cmake --build build --config Release

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: DisablePrivateChat
          path: build/Release/DisablePrivateChat.dll
