name: Build Plugin

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup CMake
        uses: ilammy/msvc-dev-cmd@v1

      - name: Fetch LeviLamina SDK
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/LiteLDev/LeviLamina/releases/latest/download/sdk-windows-x64.zip" -OutFile "sdk.zip"
          Expand-Archive sdk.zip -DestinationPath SDK

      - name: Configure CMake
        run: |
          cmake -B build -A x64

      - name: Build Plugin
        run: |
          cmake --build build --config Release

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: DisablePrivateChat
          path: build/Release/DisablePrivateChat.dll
